name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3"
          use-dotnet: false

      - name: Import project (generate .godot cache + icon imports)
        run: godot --headless --import --path .

      - name: Export HTML5 build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html --path .

      - name: Verify export
        run: |
          test -f build/web/index.html
          test -f build/web/index.wasm
          echo "HTML5 export OK"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4